<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cascade Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222;
    --border: #2e2e2e;
    --text: #f0f0f0;
    --text2: #999;
    --accent: #00aff0;
    --like: #ef476f;
    --radius: 12px;
  }

  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; }

  /* ── Creator selector ── */
  #creator-select-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 16px;
  }
  #creator-select-screen h1 { font-size: 1.4rem; color: var(--text2); }
  .creator-btn {
    padding: 12px 32px; background: var(--accent); color: #fff; border: none;
    border-radius: 24px; font-size: 1rem; cursor: pointer; font-weight: 600;
  }
  .creator-btn:hover { opacity: 0.85; }

  /* ── App Layout & Sidebar ── */
  #app { max-width: 100%; margin: 0; padding: 0; display: flex; min-height: 100vh; }

  #sidebar {
    width: 260px; background: #121212; border-right: 1px solid var(--border);
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 150;
    display: flex; flex-direction: column; overflow-y: auto;
    transition: transform 0.25s ease;
  }
  .sidebar-header {
    padding: 16px 16px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .sidebar-avatar {
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
    background: var(--surface); flex-shrink: 0;
  }
  .sidebar-name { font-weight: 700; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-username { font-size: 0.78rem; color: var(--text2); }

  .sidebar-nav {
    padding: 12px 10px; display: flex; flex-direction: column; gap: 4px;
  }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-radius: 10px; color: var(--text2);
    font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none;
    background: none; text-align: left; transition: background 0.15s, color 0.15s;
    width: 100%;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(0, 175, 240, 0.15); color: var(--accent); }
  .nav-item-left { display: flex; align-items: center; gap: 10px; }
  .nav-badge {
    background: var(--surface2); color: var(--text2); font-size: 0.75rem;
    padding: 2px 8px; border-radius: 12px; font-weight: 700;
  }
  .nav-item.active .nav-badge { background: var(--accent); color: #fff; }

  .sidebar-section-title {
    padding: 16px 14px 6px; font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--text2);
  }

  .sidebar-labels {
    padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 2px;
  }
  .sidebar-label-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; border-radius: 8px; font-size: 0.84rem; color: var(--text2);
    cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .sidebar-label-item:hover { background: var(--surface2); color: var(--text); }
  .sidebar-label-item.active { background: var(--surface2); color: var(--accent); font-weight: 600; }

  .sidebar-footer {
    margin-top: auto; padding: 16px; border-top: 1px solid var(--border);
  }
  .switch-creator-btn {
    width: 100%; padding: 9px 14px; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.15s;
  }
  .switch-creator-btn:hover { background: var(--border); }

  #main-content {
    flex: 1; margin-left: 260px; max-width: 720px; min-height: 100vh; padding-bottom: 60px;
  }
  .mobile-menu-btn {
    display: none; background: none; border: none; color: var(--text);
    font-size: 1.3rem; cursor: pointer; padding: 4px 8px;
  }

  #sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 140; backdrop-filter: blur(3px);
  }

  @media (max-width: 900px) {
    #sidebar { transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay.open { display: block; }
    #main-content { margin-left: 0; max-width: 100%; }
    .mobile-menu-btn { display: flex; }
  }

  /* ── Profile header ── */
  .profile-header { margin-bottom: 0; }
  .profile-banner-wrap { position: relative; }
  .profile-banner {
    width: 100%; height: 200px; object-fit: cover; display: block;
    background: var(--surface);
  }
  .profile-banner-placeholder { width: 100%; height: 200px; background: linear-gradient(135deg, #1a1a2e, #16213e); }
  .profile-avatar-wrap {
    position: absolute; bottom: -46px; left: 20px;
    border: 3px solid var(--bg); border-radius: 50%;
  }
  .profile-avatar {
    width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
    background: var(--surface); display: block;
  }
  .profile-info { padding: 54px 20px 16px; }
  .profile-name { font-size: 1.2rem; font-weight: 700; }
  .profile-username { color: var(--text2); font-size: 0.88rem; margin-bottom: 10px; }
  .profile-bio { font-size: 0.92rem; line-height: 1.6; color: var(--text); margin-bottom: 12px; }
  .profile-bio a, .post-text a { color: var(--accent); text-decoration: none; }
  .profile-bio a:hover, .post-text a:hover { text-decoration: underline; }
  .profile-bio p, .post-text p { margin-bottom: 0.4em; }
  .profile-bio ul, .post-text ul { padding-left: 1.2em; }
  .profile-bio br, .post-text br { display: block; content: ""; margin-top: 0.2em; }
  .profile-stats { display: flex; gap: 20px; font-size: 0.83rem; color: var(--text2); flex-wrap: wrap; }
  .profile-stats span b { color: var(--text); }

  /* ── Post card ── */
  .post {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin: 16px 12px; overflow: hidden;
  }
  .post-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .post-meta { flex: 1; }
  .post-author { font-weight: 600; font-size: 0.95rem; }
  .post-date { font-size: 0.8rem; color: var(--text2); }

  .post-text {
    padding: 0 16px 12px; font-size: 0.95rem; line-height: 1.6;
    word-break: break-word;
  }
  .post-text p { margin: 0; }

  /* ── Media grid ── */
  .media-grid { display: grid; gap: 2px; }
  .media-grid.count-1 { grid-template-columns: 1fr; }
  .media-grid.count-2 { grid-template-columns: 1fr 1fr; }
  .media-grid.count-3 { grid-template-columns: 1fr 1fr; }
  .media-grid.count-3 .media-item:first-child { grid-column: 1 / -1; }
  .media-grid.count-many { grid-template-columns: 1fr 1fr 1fr; }

  .media-item { position: relative; cursor: pointer; overflow: hidden; background: #000; }
  .media-item img, .media-item video {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform 0.2s;
  }
  .media-item:hover img, .media-item:hover video { transform: scale(1.03); }

  .media-grid.count-1 .media-item { aspect-ratio: auto; max-height: 600px; }
  .media-grid.count-1 .media-item img { height: auto; max-height: 600px; object-fit: contain; background: #000; }
  .media-grid.count-2 .media-item,
  .media-grid.count-3 .media-item,
  .media-grid.count-many .media-item { aspect-ratio: 1 / 1; }
  .media-grid.count-3 .media-item:first-child { aspect-ratio: 16 / 9; }

  .media-count-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(0,0,0,.65); color: #fff; font-size: 0.75rem;
    padding: 3px 8px; border-radius: 12px; backdrop-filter: blur(4px);
  }

  .video-play-icon {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 48px; height: 48px; background: rgba(0,0,0,.6); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; pointer-events: none;
    backdrop-filter: blur(4px);
  }
  .video-play-icon::after { content: "▶"; font-size: 18px; color: #fff; margin-left: 3px; }

  /* ── Post actions ── */
  .post-actions {
    display: flex; gap: 20px; padding: 12px 16px;
    border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text2);
  }
  .action { display: flex; align-items: center; gap: 6px; }
  .action .icon { font-size: 1rem; }
  .like-icon { color: var(--like); }

  /* ── Comments ── */
  .comments { padding: 0 16px 14px; border-top: 1px solid var(--border); }
  .comments-toggle {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 0.85rem; padding: 10px 0; display: block;
  }
  .comment { display: flex; gap: 10px; margin-top: 10px; font-size: 0.88rem; }
  .comment-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .comment-body { flex: 1; }
  .comment-author { font-weight: 600; margin-bottom: 2px; }
  .comment-text { color: var(--text); line-height: 1.4; }
  .comment-date { color: var(--text2); font-size: 0.78rem; margin-top: 2px; }

  /* ── Lightbox ── */
  #lightbox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.95);
    z-index: 1000; align-items: center; justify-content: center; flex-direction: column;
  }
  #lightbox.open { display: flex; }
  #lightbox img, #lightbox video {
    max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: 4px;
  }
  .lb-close {
    position: fixed; top: 16px; right: 20px; font-size: 2rem;
    color: #fff; cursor: pointer; line-height: 1; z-index: 1001;
    background: none; border: none;
  }
  .lb-nav {
    position: fixed; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,.15); border: none; color: #fff;
    font-size: 1.8rem; padding: 12px 16px; cursor: pointer; border-radius: 50%;
    backdrop-filter: blur(4px);
  }
  .lb-prev { left: 12px; }
  .lb-next { right: 12px; }
  .lb-counter {
    position: fixed; bottom: 20px; color: rgba(255,255,255,.6); font-size: 0.85rem;
  }

  /* ── Sticky header ── */
  .sticky-header {
    position: sticky; top: 0; background: rgba(15,15,15,.95);
    backdrop-filter: blur(10px); padding: 10px 14px;
    display: flex; align-items: center; gap: 10px; z-index: 100;
    border-bottom: 1px solid var(--border); height: 48px;
  }
  .back-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 1.2rem; }
  .sticky-name { font-weight: 700; font-size: 1rem; }
  .sticky-count { color: var(--text2); font-size: 0.8rem; }
  .view-toggle { margin-left: auto; display: flex; gap: 4px; }
  .view-btn {
    background: none; border: 1px solid var(--border); color: var(--text2);
    border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 1rem; line-height: 1;
    transition: background .15s, color .15s;
  }
  .view-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── Justified gallery ── */
  #gallery-container { padding: 2px 0; }
  .gallery-row { display: flex; gap: 2px; margin-bottom: 2px; }
  .gallery-item {
    overflow: hidden; position: relative; cursor: pointer; flex-shrink: 0;
    background: var(--surface);
  }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-item .video-play-icon {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .gallery-item .video-play-icon::after {
    content: "▶"; color: #fff; font-size: 1.6rem; text-shadow: 0 2px 8px rgba(0,0,0,.7);
    background: rgba(0,0,0,.35); border-radius: 50%; width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center; padding-left: 3px;
  }

  .loading { text-align: center; padding: 60px; color: var(--text2); }
  .error { text-align: center; padding: 40px; color: #ef476f; }

  /* ── Search bar ── */
  #search-bar {
    display: none; background: rgba(15,15,15,.97); border-bottom: 1px solid var(--border);
    padding: 8px 12px; position: sticky; top: 48px; z-index: 95;
  }
  #search-bar.open { display: flex; gap: 8px; align-items: center; }
  #search-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 7px 14px; color: var(--text); font-size: 0.9rem;
    outline: none;
  }
  #search-input:focus { border-color: var(--accent); }
  #search-clear {
    background: none; border: none; color: var(--text2); font-size: 1.1rem;
    cursor: pointer; padding: 4px 6px; line-height: 1;
  }
  #search-clear:hover { color: var(--text); }
  #search-count { color: var(--text2); font-size: 0.8rem; white-space: nowrap; }

  /* ── Sort dropdown ── */
  #sort-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.45); backdrop-filter: blur(3px);
    align-items: flex-end; justify-content: center;
  }
  #sort-overlay.open { display: flex; }
  .sort-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px 16px 0 0; width: 100%; max-width: 680px;
    padding-bottom: 24px; box-shadow: 0 -8px 40px rgba(0,0,0,.5);
  }
  .sort-panel-header {
    padding: 14px 18px 10px; font-weight: 700; font-size: 0.9rem;
    color: var(--text2); text-transform: uppercase; letter-spacing: .06em;
    border-bottom: 1px solid var(--border);
  }
  .sort-section { padding: 8px 0 0; }
  .sort-section-label {
    padding: 6px 18px 2px; font-size: 0.72rem; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--text2);
  }
  .sort-option {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; cursor: pointer; transition: background .1s;
  }
  .sort-option:hover { background: var(--surface2); }
  .sort-radio {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s;
  }
  .sort-radio.checked { border-color: var(--accent); }
  .sort-radio.checked::after {
    content: ""; width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
  }
  .sort-option-label { font-size: 0.95rem; }

  /* ── Media type filter bar ── */
  #media-filter-bar {
    display: none; gap: 8px; overflow-x: auto; padding: 12px 12px 4px;
    scrollbar-width: none;
  }
  #media-filter-bar::-webkit-scrollbar { display: none; }
  #media-filter-bar.open { display: flex; }

  /* ── Date picker ── */
  .date-btn {
    background: none; border: 1px solid var(--border); color: var(--text2);
    border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 0.95rem; line-height: 1;
    transition: background .15s, color .15s;
  }
  .date-btn:hover { background: var(--border); color: var(--text); }

  #date-picker-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
    align-items: flex-start; justify-content: center; padding-top: 60px;
  }
  #date-picker-overlay.open { display: flex; }

  .date-picker-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    width: 320px; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .date-picker-header {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; justify-content: space-between;
  }
  .date-picker-close {
    background: none; border: none; color: var(--text2); cursor: pointer; font-size: 1.2rem; line-height: 1;
  }
  .date-picker-close:hover { color: var(--text); }

  .date-scroll {
    overflow-y: auto; flex: 1; padding: 4px 0 8px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }

  /* ── Polls / Voting ── */
  .poll-wrap {
    margin: 10px 16px; padding: 12px 14px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 10px; font-size: 0.88rem;
  }
  .poll-meta { font-size: 0.78rem; color: var(--text2); margin-bottom: 10px; display: flex; justify-content: space-between; }
  .poll-option { margin-bottom: 8px; }
  .poll-option:last-child { margin-bottom: 0; }
  .poll-option-bar-bg {
    background: rgba(255,255,255,.06); border-radius: 6px; overflow: hidden; height: 32px;
    display: flex; align-items: center; position: relative; border: 1px solid var(--border);
  }
  .poll-option-fill {
    position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); opacity: 0.35;
  }
  .poll-option-text {
    position: relative; z-index: 1; padding: 0 12px; font-size: 0.85rem; font-weight: 500;
    display: flex; justify-content: space-between; width: 100%; color: var(--text);
  }

  /* ── Stream & Fundraising Badges ── */
  .stream-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(239, 71, 111, 0.15); border: 1px solid var(--like); color: var(--like);
    padding: 4px 10px; border-radius: 14px; font-size: 0.8rem; font-weight: 600; margin: 6px 16px 10px;
  }
  .stream-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--like); animation: streamPulse 1.5s infinite; }
  @keyframes streamPulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

  .fundraising-wrap {
    margin: 10px 16px; padding: 12px 14px; background: rgba(0, 175, 240, 0.08);
    border: 1px solid rgba(0, 175, 240, 0.3); border-radius: 10px;
  }
  .fundraising-header { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 6px; color: var(--accent); font-weight: 600; }
  .fundraising-bar-bg { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .fundraising-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }

  /* ── Messages UI ── */
  #messages-container { display: flex; flex-direction: column; gap: 14px; padding: 16px 12px; }
  .msg-bubble {
    padding: 14px 18px; border-radius: 18px; max-width: 85%;
    font-size: 0.92rem; line-height: 1.5; word-break: break-word;
  }
  .msg-bubble.creator {
    background: var(--surface); border: 1px solid var(--border); margin-right: auto;
    border-bottom-left-radius: 4px;
  }
  .msg-bubble.fan {
    background: rgba(0, 175, 240, 0.15); border: 1px solid rgba(0, 175, 240, 0.3); margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .msg-header { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; color: var(--text2); margin-bottom: 6px; gap: 8px; }
  .msg-author { font-weight: 700; color: var(--text); }
  .msg-tip { background: #ffd166; color: #000; font-size: 0.72rem; font-weight: 700; padding: 2px 6px; border-radius: 8px; }

  /* ── Locked PPV Media Card ── */
  .locked-media-card {
    margin-top: 10px; padding: 20px 16px; background: rgba(0, 0, 0, 0.4);
    border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; text-align: center;
  }
  .locked-icon { font-size: 1.8rem; margin-bottom: 2px; }
  .locked-title { font-size: 0.88rem; font-weight: 600; color: var(--text); }
  .locked-price {
    background: #ffd166; color: #000; font-size: 0.8rem; font-weight: 700;
    padding: 3px 10px; border-radius: 12px; margin-top: 4px;
  }

  /* ── Stories UI ── */
  #stories-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 16px 12px; }
  .story-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; cursor: pointer; position: relative;
  }
  .story-card-media { aspect-ratio: 9 / 16; overflow: hidden; position: relative; background: #000; }
  .story-card-media img, .story-card-media video { width: 100%; height: 100%; object-fit: cover; }
  .story-card-info { padding: 10px 12px; font-size: 0.82rem; color: var(--text2); display: flex; justify-content: space-between; }
</style>
</head>
<body>

<div id="creator-select-screen" style="display:none">
  <h1>Cascade Viewer</h1>
  <div id="creator-list"></div>
</div>

<div id="app" style="display:none">
  <!-- Left Sidebar Navigation -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <img class="sidebar-avatar" id="sb-avatar" src="" />
      <div class="sidebar-profile-info">
        <div class="sidebar-name" id="sb-name"></div>
        <div class="sidebar-username" id="sb-username"></div>
      </div>
    </div>
    
    <nav class="sidebar-nav">
      <button class="nav-item active" id="nav-posts" onclick="switchTab('posts', this)">
        <div class="nav-item-left"><span>📰</span><span>Posts</span></div>
        <span class="nav-badge" id="badge-posts">0</span>
      </button>
      <button class="nav-item" id="nav-media" onclick="switchTab('media', this)">
        <div class="nav-item-left"><span>🖼️</span><span>Media</span></div>
        <span class="nav-badge" id="badge-media">0</span>
      </button>
      <button class="nav-item" id="nav-messages" onclick="switchTab('messages', this)">
        <div class="nav-item-left"><span>💬</span><span>Messages</span></div>
        <span class="nav-badge" id="badge-messages">0</span>
      </button>
      <button class="nav-item" id="nav-stories" onclick="switchTab('stories', this)">
        <div class="nav-item-left"><span>📖</span><span>Stories</span></div>
        <span class="nav-badge" id="badge-stories">0</span>
      </button>
    </nav>

    <div class="sidebar-section-title" id="sb-labels-title" style="display:none">Labels & Tags</div>
    <div class="sidebar-labels" id="sidebar-labels-list"></div>

    <div class="sidebar-footer">
      <button class="switch-creator-btn" onclick="showCreatorSelect()">
        <span>← Switch Creator</span>
      </button>
    </div>
  </aside>

  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- Main Content Area -->
  <main id="main-content">
    <div class="sticky-header">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
      <button class="back-btn" onclick="showCreatorSelect()" title="Switch creator">←</button>
      <div>
        <div class="sticky-name" id="header-name"></div>
        <div class="sticky-count" id="header-count"></div>
      </div>
      <div class="view-toggle">
        <button class="date-btn" id="search-btn" onclick="toggleSearch()" title="Search posts">🔍</button>
        <button class="date-btn" onclick="openDatePicker()" title="Jump to date">📅</button>
        <button class="date-btn" id="sort-btn" onclick="openSort()" title="Sort">⇅</button>
      </div>
    </div>

    <div id="search-bar">
      <input id="search-input" type="search" placeholder="Search content…" oninput="onSearch(this.value)" />
      <span id="search-count"></span>
      <button id="search-clear" onclick="clearSearch()">✕</button>
    </div>

    <div id="feed"></div>
  </main>
</div>

<div id="sort-overlay" onclick="closeSortOnBg(event)">
  <div class="sort-panel">
    <div class="sort-panel-header">Sort & Filter</div>
    <div class="sort-section">
      <div class="sort-section-label">Order by</div>
      <div class="sort-option" onclick="setSortKey('date')">
        <div class="sort-radio" id="skey-date"></div><span class="sort-option-label">Latest posts</span>
      </div>
      <div class="sort-option" onclick="setSortKey('likes')">
        <div class="sort-radio" id="skey-likes"></div><span class="sort-option-label">Most liked</span>
      </div>
      <div class="sort-option" onclick="setSortKey('tips')">
        <div class="sort-radio" id="skey-tips"></div><span class="sort-option-label">Highest tips</span>
      </div>
    </div>
    <div class="sort-section">
      <div class="sort-section-label">Direction</div>
      <div class="sort-option" onclick="setSortDir('desc')">
        <div class="sort-radio" id="sdir-desc"></div><span class="sort-option-label">Descending</span>
      </div>
      <div class="sort-option" onclick="setSortDir('asc')">
        <div class="sort-radio" id="sdir-asc"></div><span class="sort-option-label">Ascending</span>
      </div>
    </div>
  </div>
</div>

<div id="date-picker-overlay" onclick="closeDatePickerOnBg(event)">
  <div class="date-picker-panel">
    <div class="date-picker-header">
      <span>Jump to date</span>
      <button class="date-picker-close" onclick="closeDatePicker()">✕</button>
    </div>
    <div class="date-scroll" id="date-picker-body"></div>
  </div>
</div>

<div id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <button class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
  <div id="lb-content"></div>
  <button class="lb-nav lb-next" onclick="lbNav(1)">›</button>
  <div class="lb-counter" id="lb-counter"></div>
</div>

<script>
let currentCreator = null;
let metadata = null;
let lbItems = [];
let lbIndex = 0;
let currentSortKey = "date";
let currentSortDir = "desc";
let currentSearch = "";
let currentLabel = null;
let currentMediaOnly = false;
let currentMediaType = "all";
let galleryAllItems = [];

function esc(str) {
  if (!str) return "";
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fmt(num) {
  if (num == null) return "0";
  if (num >= 1000000) return (num / 1000000).toFixed(1) + "M";
  if (num >= 1000) return (num / 1000).toFixed(1) + "K";
  return String(num);
}

function fmtDate(isoStr) {
  if (!isoStr) return "";
  const d = new Date(isoStr);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function renderText(html) {
  if (!html) return "";
  return html;
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebar-overlay").classList.toggle("open");
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar-overlay").classList.remove("open");
}

function getRoute() {
  const m = location.pathname.match(/^\/creator\/([^/]+)/);
  return m ? m[1] : null;
}

async function init() {
  const creator = getRoute();
  if (creator) {
    await loadCreator(creator);
  } else {
    await showCreatorSelect();
  }
}

async function showCreatorSelect() {
  history.pushState({}, "", "/");
  document.getElementById("creator-select-screen").style.display = "flex";
  document.getElementById("app").style.display = "none";
  const list = document.getElementById("creator-list");
  list.innerHTML = '<div class="loading">Loading...</div>';
  try {
    const creators = await fetch("/api/creators").then(r => r.json());
    if (!creators.length) {
      list.innerHTML = '<div class="error">No creators with metadata found.</div>';
      return;
    }
    list.innerHTML = creators.map(c =>
      `<button class="creator-btn" onclick="loadCreator('${c}')">@${c}</button>`
    ).join("");
  } catch {
    list.innerHTML = '<div class="error">Could not load creators.</div>';
  }
}

async function loadCreator(username) {
  history.pushState({}, "", `/creator/${username}`);
  document.getElementById("creator-select-screen").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("feed").innerHTML = '<div class="loading">Loading...</div>';

  try {
    const data = await fetch(`/api/metadata/${username}`).then(r => r.json());
    if (data.error) { document.getElementById("feed").innerHTML = `<div class="error">${data.error}</div>`; return; }
    currentCreator = username;
    metadata = data;
    galleryAllItems = [];
    currentSearch = "";
    currentSortKey = "date";
    currentSortDir = "desc";
    currentMediaType = "all";
    currentLabel = null;
    render();
  } catch (e) {
    document.getElementById("feed").innerHTML = `<div class="error">Failed to load: ${e.message}</div>`;
  }
}

function render() {
  const { profile, posts, comments } = metadata;
  const msgs = metadata.messages || [];
  const strs = metadata.stories || [];
  const totalMedia = (profile.photosCount || 0) + (profile.videosCount || 0);

  // Update header & sidebar profile info
  document.getElementById("header-name").textContent = profile.name;
  document.getElementById("header-count").textContent = `${posts.length} posts`;

  document.getElementById("sb-name").textContent = profile.name;
  document.getElementById("sb-username").textContent = `@${profile.username}`;
  document.getElementById("sb-avatar").src = profile.avatar || "";

  // Badges
  document.getElementById("badge-posts").textContent = fmt(posts.length);
  document.getElementById("badge-media").textContent = fmt(totalMedia);
  document.getElementById("badge-messages").textContent = fmt(msgs.length);
  document.getElementById("badge-stories").textContent = fmt(strs.length);

  // Sidebar labels
  const sbLabelsTitle = document.getElementById("sb-labels-title");
  const sbLabelsList = document.getElementById("sidebar-labels-list");
  const labels = metadata.labels || [];
  if (labels.length > 0) {
    sbLabelsTitle.style.display = "block";
    sbLabelsList.innerHTML = `
      <div class="sidebar-label-item active" onclick="filterLabel(null, this)">
        <span>All Posts</span><span>${fmt(posts.length)}</span>
      </div>
      ${labels.map(l => `
        <div class="sidebar-label-item" onclick="filterLabel(${JSON.stringify(l.id)}, this)">
          <span>${esc(l.name)}</span><span>${fmt(l.postsCount)}</span>
        </div>
      `).join("")}
    `;
  } else {
    sbLabelsTitle.style.display = "none";
    sbLabelsList.innerHTML = "";
  }

  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  // Profile header
  const ph = document.createElement("div");
  ph.className = "profile-header";
  ph.innerHTML = `
    <div class="profile-banner-wrap">
      ${profile.header
        ? `<img class="profile-banner" src="${profile.header}" loading="lazy" />`
        : `<div class="profile-banner-placeholder"></div>`}
      <div class="profile-avatar-wrap">
        <img class="profile-avatar" src="${profile.avatar || ''}" loading="lazy" />
      </div>
    </div>
    <div class="profile-info">
      <div class="profile-name">${esc(profile.name)}${profile.isVerified ? ' ✓' : ''}</div>
      <div class="profile-username">@${esc(profile.username)}</div>
      ${profile.about ? `<div class="profile-bio">${profile.about}</div>` : ""}
      <div class="profile-stats">
        <span><b>${fmt(profile.postsCount)}</b> Posts</span>
        <span><b>${fmt(profile.photosCount)}</b> Photos</span>
        <span><b>${fmt(profile.videosCount)}</b> Videos</span>
        ${profile.subscribersCount != null ? `<span><b>${fmt(profile.subscribersCount)}</b> Fans</span>` : ""}
      </div>
    </div>
  `;
  feed.appendChild(ph);

  // Media type filter bar (shown in media tab)
  const mediaFilterBar = document.createElement("div");
  mediaFilterBar.id = "media-filter-bar";
  feed.appendChild(mediaFilterBar);

  // Containers
  const postsContainer = document.createElement("div");
  postsContainer.id = "posts-container";
  feed.appendChild(postsContainer);

  const galleryContainer = document.createElement("div");
  galleryContainer.id = "gallery-container";
  galleryContainer.style.display = "none";
  feed.appendChild(galleryContainer);

  const messagesContainer = document.createElement("div");
  messagesContainer.id = "messages-container";
  messagesContainer.style.display = "none";
  feed.appendChild(messagesContainer);

  const storiesContainer = document.createElement("div");
  storiesContainer.id = "stories-container";
  storiesContainer.style.display = "none";
  feed.appendChild(storiesContainer);

  buildAllPosts(posts, profile, comments);
}

let allPostEls = [];

function buildAllPosts(posts, profile, comments) {
  const container = document.getElementById("posts-container");
  container.innerHTML = "";
  allPostEls = [];
  for (const post of posts) {
    const el = renderPost(post, profile, comments[String(post.id)] || []);
    if (post.media.filter(m => m.type === "photo" || m.type === "video").length === 0) {
      el.classList.add("no-media");
    }
    el.dataset.postId = post.id;
    el.dataset.labelIds = JSON.stringify(post.labelIds || []);
    container.appendChild(el);
    allPostEls.push(el);
  }
}

function applyFilter(labelId, mediaOnly) {
  const q = currentSearch.toLowerCase();
  for (let i = 0; i < allPostEls.length; i++) {
    const el = allPostEls[i];
    let show = true;
    if (mediaOnly && el.classList.contains("no-media")) show = false;
    if (labelId != null) {
      const ids = JSON.parse(el.dataset.labelIds || "[]");
      if (!ids.includes(labelId)) show = false;
    }
    if (q && show) {
      const text = (metadata.posts[i].text || "").toLowerCase();
      if (!text.includes(q)) show = false;
    }
    el.style.display = show ? "" : "none";
  }
}

function switchTab(tab, btn) {
  document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  closeSidebar();

  const mediaBar = document.getElementById("media-filter-bar");
  const sortBtn = document.getElementById("sort-btn");
  const searchBtn = document.getElementById("search-btn");
  const posts = document.getElementById("posts-container");
  const gallery = document.getElementById("gallery-container");
  const messages = document.getElementById("messages-container");
  const stories = document.getElementById("stories-container");

  if (mediaBar) mediaBar.classList.remove("open");
  if (posts) posts.style.display = "none";
  if (gallery) gallery.style.display = "none";
  if (messages) messages.style.display = "none";
  if (stories) stories.style.display = "none";

  if (tab === "posts") {
    currentMediaOnly = false;
    sortBtn.style.display = "";
    searchBtn.style.display = "";
    if (posts) posts.style.display = "";
    applyFilter(currentLabel, false);
  } else if (tab === "media") {
    currentMediaOnly = true;
    sortBtn.style.display = "none";
    searchBtn.style.display = "none";
    clearSearch();
    if (gallery) gallery.style.display = "";
    buildMediaFilterBar();
    if (mediaBar) mediaBar.classList.add("open");
    buildGallery();
    currentMediaType = "all";
  } else if (tab === "messages") {
    sortBtn.style.display = "none";
    searchBtn.style.display = "none";
    clearSearch();
    if (messages) { messages.style.display = "flex"; buildMessages(); }
  } else if (tab === "stories") {
    sortBtn.style.display = "none";
    searchBtn.style.display = "none";
    clearSearch();
    if (stories) { stories.style.display = "grid"; buildStories(); }
  }
}

function filterLabel(labelId, btn) {
  currentLabel = labelId;
  document.querySelectorAll(".sidebar-label-item").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  switchTab('posts', document.getElementById('nav-posts'));
}

function buildMessages() {
  const container = document.getElementById("messages-container");
  container.innerHTML = "";
  const msgs = metadata.messages || [];
  if (!msgs.length) {
    container.innerHTML = '<div class="loading">No messages found.</div>';
    return;
  }
  for (const m of msgs) {
    const el = document.createElement("div");
    const isCreator = m.isFromCreator || (m.fromUser?.username === metadata.profile.username);
    el.className = `msg-bubble ${isCreator ? "creator" : "fan"}`;

    const lbKey = `msg-lb-${m.id}`;
    const mediaList = (m.media || []).filter(item => item.type === "photo" || item.type === "video");
    const n = mediaList.length;
    const gridClass = n === 0 ? "" : n === 1 ? "count-1" : n === 2 ? "count-2" : "count-many";

    const isLocked = m.canPurchase || (m.price > 0 && !m.isOpened) || mediaList.some(item => item.canView === false);

    const mediaHtml = n > 0 ? (
      isLocked ? `
        <div class="locked-media-card">
          <div class="locked-icon">🔒</div>
          <div class="locked-title">Locked PPV Content</div>
          <div class="locked-price">$${m.price || 45}</div>
        </div>
      ` : `
        <div class="media-grid ${gridClass}" style="margin-top:8px">
          ${mediaList.map((item, idx) => {
            const src = `/media/${currentCreator}/msg_${m.id}_${item.id}.${item.type === "video" ? "mp4" : "jpg"}`;
            const thumbSrc = `/thumb/${currentCreator}/msg_${m.id}_${item.id}.mp4`;
            return `
              <div class="media-item" onclick="openLightbox('${lbKey}', ${idx})">
                ${item.type === "video"
                  ? `<img src="${thumbSrc}" loading="lazy" onerror="this.onerror=null;this.src='${src}';" /><div class="video-play-icon"></div>`
                  : `<img src="${src}" loading="lazy" />`}
              </div>
            `;
          }).join("")}
        </div>
      `
    ) : "";

    window[lbKey] = mediaList.map(item => ({
      type: item.type,
      src: `/media/${currentCreator}/msg_${m.id}_${item.id}.${item.type === "video" ? "mp4" : "jpg"}`,
    }));

    const authorName = m.fromUser?.name || m.fromUser?.username || (isCreator ? metadata.profile.name : "Fan");
    const tipBadge = (m.isTip || m.price > 0 || m.tipAmount) ? `<span class="msg-tip">💰 $${m.tipAmount || m.price || ""}</span>` : "";

    el.innerHTML = `
      <div class="msg-header">
        <span class="msg-author">${esc(authorName)}</span>
        <div style="display:flex;align-items:center;gap:6px">
          ${tipBadge}
          <span>${fmtDate(m.createdAt)}</span>
        </div>
      </div>
      ${m.text ? `<div class="msg-text">${renderText(m.text)}</div>` : ""}
      ${mediaHtml}
    `;
    container.appendChild(el);
  }
}

function buildStories() {
  const container = document.getElementById("stories-container");
  container.innerHTML = "";
  const strs = metadata.stories || [];
  if (!strs.length) {
    container.innerHTML = '<div class="loading">No stories found.</div>';
    return;
  }
  for (const s of strs) {
    const el = document.createElement("div");
    el.className = "story-card";
    const mediaList = s.media || [];
    const firstMedia = mediaList[0];
    const lbKey = `story-lb-${s.id}`;

    let mediaPreview = "";
    if (firstMedia) {
      const src = `/media/${currentCreator}/story_${s.id}_${firstMedia.id}.${firstMedia.type === "video" ? "mp4" : "jpg"}`;
      const thumbSrc = `/thumb/${currentCreator}/story_${s.id}_${firstMedia.id}.mp4`;
      mediaPreview = firstMedia.type === "video"
        ? `<div class="story-card-media"><img src="${thumbSrc}" loading="lazy" onerror="this.onerror=null;this.src='${src}';" /><div class="video-play-icon"></div></div>`
        : `<div class="story-card-media"><img src="${src}" loading="lazy" /></div>`;
    }

    window[lbKey] = mediaList.map(item => ({
      type: item.type,
      src: `/media/${currentCreator}/story_${s.id}_${item.id}.${item.type === "video" ? "mp4" : "jpg"}`,
    }));

    el.onclick = () => openLightbox(lbKey, 0);
    el.innerHTML = `
      ${mediaPreview}
      <div class="story-card-info">
        <span>Story #${s.id}</span>
        <span>${fmtDate(s.createdAt)}</span>
      </div>
    `;
    container.appendChild(el);
  }
}

function renderGallery(container, items) {
  container.innerHTML = "";
  if (!items.length) { container.innerHTML = '<div class="loading">No media found.</div>'; return; }
  const TARGET_H = 180;
  let row = [];
  let rowArSum = 0;

  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    row.push({ ...item, origIdx: i });
    rowArSum += item.ar;
    if (rowArSum * TARGET_H >= 640 || i === items.length - 1) {
      const rowEl = document.createElement("div");
      rowEl.className = "gallery-row";
      const h = Math.min(TARGET_H * 1.5, Math.floor(640 / rowArSum));
      for (const rItem of row) {
        const w = Math.floor(h * rItem.ar);
        const itemEl = document.createElement("div");
        itemEl.className = "gallery-item" + (rItem.type === "audio" ? " audio-item" : "");
        itemEl.style.width = `${w}px`;
        itemEl.style.height = `${h}px`;
        itemEl.onclick = () => openGalleryLightbox(rItem.origIdx);
        if (rItem.type === "audio") {
          itemEl.innerHTML = `<div class="audio-icon">🎵</div><div class="audio-label">${esc(rItem.filename)}</div>`;
        } else if (rItem.type === "video") {
          itemEl.innerHTML = `<img src="${rItem.thumbSrc}" loading="lazy" onerror="this.onerror=null;this.src='${rItem.src}';" /><div class="video-play-icon"></div>`;
        } else {
          itemEl.innerHTML = `<img src="${rItem.src}" loading="lazy" />`;
        }
        rowEl.appendChild(itemEl);
      }
      container.appendChild(rowEl);
      row = [];
      rowArSum = 0;
    }
  }
}

function buildGallery() {
  const container = document.getElementById("gallery-container");
  if (galleryAllItems.length === 0) {
    for (let pi = 0; pi < metadata.posts.length; pi++) {
      const post = metadata.posts[pi];
      for (const m of post.media) {
        if (m.type !== "photo" && m.type !== "video" && m.type !== "audio") continue;
        let ext = m.type === "audio" ? "mp3" : m.type === "video" ? "mp4" : "jpg";
        let src = `/media/${currentCreator}/${post.id}_${m.id}.${ext}`;
        let thumbSrc = m.type === "video" ? `/thumb/${currentCreator}/${post.id}_${m.id}.mp4` : src;
        const w = (m.files?.full?.width || m.files?.thumb?.width || 1);
        const h = (m.files?.full?.height || m.files?.thumb?.height || 1);
        let ar = w / h || 1;
        galleryAllItems.push({ src, thumbSrc, type: m.type, ar, filename: `${post.id}_${m.id}.${ext}` });
      }
    }
    for (const msg of (metadata.messages || [])) {
      for (const m of (msg.media || [])) {
        if (m.type !== "photo" && m.type !== "video" && m.type !== "audio") continue;
        let ext = m.type === "audio" ? "mp3" : m.type === "video" ? "mp4" : "jpg";
        let src = `/media/${currentCreator}/msg_${msg.id}_${m.id}.${ext}`;
        let thumbSrc = m.type === "video" ? `/thumb/${currentCreator}/msg_${msg.id}_${m.id}.mp4` : src;
        galleryAllItems.push({ src, thumbSrc, type: m.type, ar: 1, filename: `msg_${msg.id}_${m.id}.${ext}` });
      }
    }
    for (const story of (metadata.stories || [])) {
      for (const m of (story.media || [])) {
        if (m.type !== "photo" && m.type !== "video" && m.type !== "audio") continue;
        let ext = m.type === "audio" ? "mp3" : m.type === "video" ? "mp4" : "jpg";
        let src = `/media/${currentCreator}/story_${story.id}_${m.id}.${ext}`;
        let thumbSrc = m.type === "video" ? `/thumb/${currentCreator}/story_${story.id}_${m.id}.mp4` : src;
        galleryAllItems.push({ src, thumbSrc, type: m.type, ar: 9/16, filename: `story_${story.id}_${m.id}.${ext}` });
      }
    }
  }
  renderGallery(container, galleryAllItems);
}

function buildMediaFilterBar() {
  const bar = document.getElementById("media-filter-bar");
  bar.innerHTML = `
    <button class="label-chip active" onclick="filterMediaType('all', this)">All Media</button>
    <button class="label-chip" onclick="filterMediaType('photo', this)">📷 Photos</button>
    <button class="label-chip" onclick="filterMediaType('video', this)">🎥 Videos</button>
    <button class="label-chip" onclick="filterMediaType('audio', this)">🎵 Audio</button>
  `;
}

function filterMediaType(type, btn) {
  currentMediaType = type;
  document.querySelectorAll("#media-filter-bar .label-chip").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  const filtered = type === "all" ? galleryAllItems : galleryAllItems.filter(i => i.type === type);
  renderGallery(document.getElementById("gallery-container"), filtered);
}

function renderPost(post, profile, comments) {
  const el = document.createElement("div");
  el.className = "post";

  const mediaList = post.media.filter(m => m.type === "photo" || m.type === "video");
  const n = mediaList.length;
  const gridClass = n === 0 ? "" : n === 1 ? "count-1" : n === 2 ? "count-2" : n === 3 ? "count-3" : "count-many";
  const MAX_VISIBLE = 9;
  const visible = mediaList.slice(0, MAX_VISIBLE);
  const hidden = n - MAX_VISIBLE;

  const lbKey = `lb-${post.id}`;

  const mediaHtml = n > 0 ? `
    <div class="media-grid ${gridClass}" data-lb-key="${lbKey}">
      ${visible.map((m, i) => {
        const src = `/media/${currentCreator}/${post.id}_${m.id}.${m.type === "video" ? "mp4" : "jpg"}`;
        const thumbSrc = `/thumb/${currentCreator}/${post.id}_${m.id}.mp4`;
        const isLast = i === visible.length - 1 && hidden > 0;
        return `
          <div class="media-item" onclick="openLightbox('${lbKey}', ${i})">
            ${m.type === "video"
              ? `<img src="${thumbSrc}" loading="lazy" onerror="this.onerror=null;this.src='${src}';" /><div class="video-play-icon"></div>`
              : `<img src="${src}" loading="lazy" />`}
            ${isLast ? `<div class="media-count-badge">+${hidden + 1}</div>` : ""}
          </div>
        `;
      }).join("")}
    </div>
  ` : "";

  const streamHtml = post.streamId ? `
    <div class="stream-badge">
      <span class="stream-dot"></span>
      <span>Livestream ${post.streamDuration ? `(${Math.round(post.streamDuration / 60)} min)` : ""}</span>
    </div>
  ` : "";

  const fr = post.fundRaising;
  const fundHtml = fr ? `
    <div class="fundraising-wrap">
      <div class="fundraising-header">
        <span>Goal: $${fr.target}</span>
        <span>$${fr.targetProgress || 0} raised (${Math.round(((fr.targetProgress || 0) / fr.target) * 100)}%)</span>
      </div>
      <div class="fundraising-bar-bg">
        <div class="fundraising-bar-fill" style="width:${Math.min(100, Math.round(((fr.targetProgress || 0) / fr.target) * 100))}%"></div>
      </div>
    </div>
  ` : "";

  const v = post.voting;
  const pollHtml = v ? `
    <div class="poll-wrap">
      <div class="poll-meta">
        <span>Poll (${v.total || 0} total votes)</span>
        <span>${v.finishedAt ? "Finished" : "Active"}</span>
      </div>
      ${(v.options || []).map(opt => {
        const pct = v.total > 0 && opt.count != null ? Math.round((opt.count / v.total) * 100) : 0;
        return `
          <div class="poll-option">
            <div class="poll-option-bar-bg">
              <div class="poll-option-fill" style="width:${pct}%"></div>
              <div class="poll-option-text">
                <span>${esc(opt.name)}</span>
                <span>${opt.count != null ? `${opt.count} (${pct}%)` : ""}</span>
              </div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  ` : "";

  el.innerHTML = `
    <div class="post-header">
      <img class="post-avatar" src="${profile.avatar || ''}" loading="lazy" />
      <div class="post-meta">
        <div class="post-author">${esc(profile.name)}</div>
        <div class="post-date">${fmtDate(post.postedAt)}</div>
      </div>
    </div>
    ${streamHtml}
    ${post.text ? `<div class="post-text">${post.text}</div>` : ""}
    ${fundHtml}
    ${pollHtml}
    ${mediaHtml}
    <div class="post-actions">
      <div class="action"><span class="icon like-icon">♥</span> ${fmt(post.favoritesCount)}</div>
      <div class="action"><span class="icon">💬</span> ${fmt(post.commentsCount)}</div>
      ${post.tipsAmount && post.tipsAmount !== "$0" ? `<div class="action"><span class="icon">💰</span> ${esc(post.tipsAmount)}</div>` : ""}
      <div class="action" style="margin-left:auto;color:var(--text2)">${n} file${n !== 1 ? "s" : ""}</div>
    </div>
    ${comments.length > 0 ? renderComments(comments, post.commentsCount) : ""}
  `;

  window[lbKey] = mediaList.map(m => ({
    type: m.type,
    src: `/media/${currentCreator}/${post.id}_${m.id}.${m.type === "video" ? "mp4" : "jpg"}`,
  }));

  return el;
}

function renderComments(comments, total) {
  const id = `comments-${Math.random().toString(36).slice(2)}`;
  const html = comments.map(c => `
    <div class="comment">
      <img class="comment-avatar" src="${c.author.avatar || ''}" loading="lazy" />
      <div class="comment-body">
        <div class="comment-author">${esc(c.author.name || c.author.username || 'User')}</div>
        <div class="comment-text">${esc(c.text)}</div>
        ${c.createdAt ? `<div class="comment-date">${fmtDate(c.createdAt)}</div>` : ''}
      </div>
    </div>
  `).join("");

  return `
    <div class="comments">
      <button class="comments-toggle" onclick="toggleComments('${id}', this)">
        Show ${comments.length} comment${comments.length !== 1 ? 's' : ''}
      </button>
      <div id="${id}" style="display:none">${html}</div>
    </div>
  `;
}

function toggleComments(id, btn) {
  const el = document.getElementById(id);
  const hidden = el.style.display === "none";
  el.style.display = hidden ? "block" : "none";
  btn.textContent = hidden ? "Hide comments" : `Show ${el.children.length} comment${el.children.length !== 1 ? 's' : ''}`;
}

function openLightbox(lbKey, index) {
  lbItems = window[lbKey] || [];
  lbIndex = index;
  renderLightbox();
  document.getElementById("lightbox").classList.add("open");
}

function openGalleryLightbox(index) {
  const items = currentMediaType === "all" ? galleryAllItems : galleryAllItems.filter(i => i.type === currentMediaType);
  lbItems = items;
  lbIndex = index;
  renderLightbox();
  document.getElementById("lightbox").classList.add("open");
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lb-content").innerHTML = "";
}

function lbNav(dir) {
  lbIndex = (lbIndex + dir + lbItems.length) % lbItems.length;
  renderLightbox();
}

function renderLightbox() {
  const item = lbItems[lbIndex];
  const content = document.getElementById("lb-content");
  if (!item) return;
  if (item.type === "video") {
    content.innerHTML = `<video src="${item.src}" controls autoplay loop></video>`;
  } else if (item.type === "audio") {
    content.innerHTML = `
      <div class="lb-audio-wrap">
        <div class="lb-audio-icon">🎵</div>
        <div class="lb-audio-name">${esc(item.filename || 'Audio track')}</div>
        <audio src="${item.src}" controls autoplay></audio>
      </div>
    `;
  } else {
    content.innerHTML = `<img src="${item.src}" />`;
  }
  document.getElementById("lb-counter").textContent = `${lbIndex + 1} / ${lbItems.length}`;
}

// Keyboards
document.addEventListener("keydown", e => {
  const lb = document.getElementById("lightbox");
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") lbNav(-1);
  if (e.key === "ArrowRight") lbNav(1);
});

// Search
function toggleSearch() {
  const bar = document.getElementById("search-bar");
  const open = bar.classList.toggle("open");
  if (open) document.getElementById("search-input").focus();
}

function onSearch(val) {
  currentSearch = val.trim();
  document.getElementById("search-clear").style.display = currentSearch ? "inline-block" : "none";
  applyFilter(currentLabel, currentMediaOnly);
}

function clearSearch() {
  currentSearch = "";
  const input = document.getElementById("search-input");
  if (input) input.value = "";
  const sc = document.getElementById("search-count");
  if (sc) sc.textContent = "";
  applyFilter(currentLabel, currentMediaOnly);
}

// Sort
function openSort() {
  document.getElementById("sort-overlay").classList.add("open");
  updateSortUI();
}

function closeSortOnBg(e) {
  if (e.target.id === "sort-overlay") document.getElementById("sort-overlay").classList.remove("open");
}

function setSortKey(key) {
  currentSortKey = key;
  updateSortUI();
  applySortOrder();
}

function setSortDir(dir) {
  currentSortDir = dir;
  updateSortUI();
  applySortOrder();
}

function updateSortUI() {
  ["date", "likes", "tips"].forEach(k => {
    const el = document.getElementById(`skey-${k}`);
    if (el) el.classList.toggle("checked", currentSortKey === k);
  });
  ["desc", "asc"].forEach(d => {
    const el = document.getElementById(`sdir-${d}`);
    if (el) el.classList.toggle("checked", currentSortDir === d);
  });
}

function openDatePicker() {
  document.getElementById("date-picker-overlay").classList.add("open");
  buildDatePickerTree();
}

function closeDatePicker() {
  document.getElementById("date-picker-overlay").classList.remove("open");
}

function closeDatePickerOnBg(e) {
  if (e.target.id === "date-picker-overlay") closeDatePicker();
}

function buildDatePickerTree() {
  const posts = metadata.posts;
  const tree = {};
  posts.forEach((p, idx) => {
    if (!p.postedAt) return;
    const d = new Date(p.postedAt);
    const y = d.getFullYear();
    const m = d.toLocaleString("en-US", { month: "short" });
    const day = d.getDate();
    if (!tree[y]) tree[y] = { count: 0, months: {} };
    tree[y].count++;
    if (!tree[y].months[m]) tree[y].months[m] = { count: 0, days: {} };
    tree[y].months[m].count++;
    if (!tree[y].months[m].days[day]) tree[y].months[m].days[day] = idx;
  });

  const body = document.getElementById("date-picker-body");
  body.innerHTML = "";

  Object.keys(tree).sort((a, b) => b - a).forEach(year => {
    const yData = tree[year];
    const yRow = document.createElement("div");
    yRow.className = "date-year-row";
    yRow.innerHTML = `<span>${year}</span><span class="year-count">${yData.count} posts <span class="year-arrow">›</span></span>`;
    
    const mContainer = document.createElement("div");
    mContainer.className = "date-months";

    Object.keys(yData.months).forEach(month => {
      const mData = yData.months[month];
      const mRow = document.createElement("div");
      mRow.className = "date-month-row";
      mRow.innerHTML = `<span class="month-label">${month}</span><span class="month-count">${mData.count} posts</span>`;
      
      const dContainer = document.createElement("div");
      dContainer.className = "date-days";

      Object.keys(mData.days).sort((a, b) => a - b).forEach(day => {
        const pIdx = mData.days[day];
        const dChip = document.createElement("button");
        dChip.className = "date-day-chip";
        dChip.textContent = day;
        dChip.onclick = () => { closeDatePicker(); scrollToPostIndex(pIdx); };
        dContainer.appendChild(dChip);
      });

      mContainer.appendChild(mRow);
      mContainer.appendChild(dContainer);
    });

    yRow.onclick = () => yRow.classList.toggle("expanded");
    body.appendChild(yRow);
    body.appendChild(mContainer);
  });
}

function scrollToPostIndex(idx) {
  const el = allPostEls[idx];
  if (!el) return;
  if (currentLabel != null || currentSearch) {
    currentSearch = "";
    currentLabel = null;
    applyFilter(null, false);
  }
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  el.style.outline = "2px solid var(--accent)";
  setTimeout(() => el.style.outline = "", 1500);
}

init();
</script>
